# =============================================
#   Cấu hình DrawServer
#   Đổi IP khi chuyển sang mạng LAN khác
#   KHÔNG cần build lại sau khi sửa file này
# =============================================

[Server]
; IP của chính máy đang chạy DrawServer này
NodeIp=192.168.2.6
NodePort=6001

; IP của máy đang chạy MasterServer (thường cùng máy với DrawServer)
MasterServerIp=192.168.2.6
MasterServerPort=5274

[Database]
; DB chạy cùng máy → server=localhost, không cần đổi
DbConnectionString=server=localhost;database=online_Drawing_DB;user=root;password=
